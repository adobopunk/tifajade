    <meta name="description" content="{% if subtitle %}{{ subtitle }}{% else %}{{ site.description }}{% endif %}" />
    <link rel="canonical" href="{{ page.url | absoluteUrl }}" />
    {% if noindex %}<meta name="robots" content="noindex, nofollow" />{% endif %}

    <meta property="og:site_name" content="Tifa Jade" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ page.url | absoluteUrl }}" />
    <meta property="og:description" content="{% if subtitle %}{{ subtitle }}{% else %}{{ site.description }}{% endif %}" />
    <meta property="og:image" content="{{ image | absoluteImage }}" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:description" content="{% if subtitle %}{{ subtitle }}{% else %}{{ site.description }}{% endif %}" />
    <meta name="twitter:image" content="{{ image | absoluteImage }}" />
